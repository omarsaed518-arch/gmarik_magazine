<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">تقديم طلب بث | Gmarik Magazine</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
        --void: #05070d;
        --deep: #0a1120;
        --panel: rgba(13, 20, 38, 0.7);
        --panel-border: rgba(226, 183, 20, 0.18);
        --gold: #e2b714;
        --gold-soft: rgba(226, 183, 20, 0.35);
        --cyan: #2dd4ee;
        --cyan-soft: rgba(45, 212, 238, 0.35);
        --emerald: #34d399;
        --text-main: #f4f6fb;
        --text-dim: #8996ad;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: var(--void);
        color: var(--text-main);
        font-family: 'Cairo', Tahoma, sans-serif;
        overflow-x: hidden;
    }

    /* ============ Backdrop ============ */
    .backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
            radial-gradient(ellipse 900px 600px at 50% -10%, rgba(226,183,20,0.12), transparent 60%),
            radial-gradient(ellipse 700px 500px at 85% 100%, rgba(45,212,238,0.08), transparent 60%),
            linear-gradient(160deg, #05070d 0%, #0a1120 45%, #0c1526 100%);
    }

    .scanlines {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background-image: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.012) 0px,
            rgba(255,255,255,0.012) 1px,
            transparent 1px,
            transparent 3px
        );
        opacity: 0.5;
    }

    /* ============ Back to Hub ============ */
    .back-home {
        position: fixed;
        top: 22px;
        inset-inline-start: 22px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 46px;
        padding: 0 16px;
        border-radius: 30px;
        background: rgba(10, 17, 32, 0.7);
        border: 1px solid rgba(226, 183, 20, 0.25);
        color: var(--gold);
        text-decoration: none;
        backdrop-filter: blur(10px);
        transition: box-shadow 0.35s ease, border-color 0.35s ease, background 0.35s ease;
    }

    .back-home i {
        font-size: 1.1rem;
        transition: transform 0.35s ease;
        transform: rotate(180deg);
    }

    .back-home span {
        max-width: 0;
        opacity: 0;
        white-space: nowrap;
        overflow: hidden;
        font-size: 0.9rem;
        font-weight: 700;
        transition: max-width 0.35s ease, opacity 0.35s ease;
    }

    .back-home:hover {
        border-color: var(--gold);
        background: rgba(226, 183, 20, 0.12);
        box-shadow: 0 0 22px rgba(226, 183, 20, 0.35);
    }

    .back-home:hover span {
        max-width: 220px;
        opacity: 1;
    }

    html[dir="ltr"] .back-home i { transform: rotate(0deg); }

    /* ============ Form Container ============ */
    .form-wrapper {
        position: relative;
        z-index: 5;
        max-width: 780px;
        margin: 100px auto 60px;
        padding: 0 20px;
    }

    .form-card {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        padding: 40px;
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        animation: cardIn 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .form-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .form-header .icon-box {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: rgba(226, 183, 20, 0.12);
        border: 1px solid var(--gold-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        color: var(--gold);
        animation: pulseIcon 2.5s ease-in-out infinite;
    }

    @keyframes pulseIcon {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(226,183,20,0); }
        50% { transform: scale(1.06); box-shadow: 0 0 20px rgba(226,183,20,0.3); }
    }

    .form-header h1 {
        font-size: 2rem;
        font-weight: 900;
        margin: 0 0 10px;
        background: linear-gradient(90deg, #fff 20%, var(--gold) 80%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .form-header p {
        color: var(--text-dim);
        font-size: 0.95rem;
    }

    /* ============ Inputs & Grid ============ */
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    @media (max-width: 650px) {
        .form-grid { grid-template-columns: 1fr; }
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group.full {
        grid-column: span 2;
    }

    .input-group label {
        display: block;
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 8px;
    }

    .input-group label span.required {
        color: #ff3b57;
        margin-inline-start: 4px;
    }

    .input-control {
        width: 100%;
        background: rgba(5, 7, 13, 0.5);
        border: 1px solid rgba(226, 183, 20, 0.2);
        border-radius: 12px;
        padding: 12px 16px;
        color: var(--text-main);
        font-family: 'Cairo', sans-serif;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .input-control:focus {
        border-color: var(--gold);
        box-shadow: 0 0 15px rgba(226, 183, 20, 0.2);
    }

    textarea.input-control {
        resize: vertical;
        min-height: 110px;
    }

    select.input-control option {
        background: var(--deep);
        color: var(--text-main);
    }

    /* ============ Submit Button ============ */
    .submit-btn {
        width: 100%;
        height: 52px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, var(--gold) 0%, #c99f0c 100%);
        color: var(--void);
        font-family: 'Cairo', sans-serif;
        font-size: 1.05rem;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 6px 20px rgba(226, 183, 20, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
        margin-top: 10px;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(226, 183, 20, 0.5);
    }

    .submit-btn:active {
        transform: translateY(0);
    }

    .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    /* Alerts */
    .alert-box {
        display: none;
        padding: 16px;
        border-radius: 12px;
        text-align: center;
        font-weight: 700;
        margin-bottom: 20px;
        animation: fadeIn 0.4s ease;
    }

    .alert-success {
        background: rgba(52, 211, 153, 0.15);
        border: 1px solid var(--emerald);
        color: var(--emerald);
    }

    .alert-error {
        background: rgba(255, 59, 87, 0.15);
        border: 1px solid #ff3b57;
        color: #ff3b57;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<div class="backdrop"></div>
<div class="scanlines"></div>

<a href="live-hub.html" class="back-home" aria-label="العودة لمركز البث">
    <i class="fa-solid fa-arrow-right"></i>
    <span data-i18n-live>العودة لمركز البث</span>
</a>

<div class="form-wrapper">
    <div class="form-card">
        <div class="form-header">
            <div class="icon-box"><i class="fa-solid fa-satellite-dish"></i></div>
            <h1 data-i18n-live>نموذج تقديم طلب بث جديد</h1>
            <p data-i18n-live>املأ البيانات أدناه بدقة ليتم مراجعتها من قِبل الإدارة واتخاذ قرار الاعتماد.</p>
        </div>

        <div id="successAlert" class="alert-box alert-success">
            <i class="fa-solid fa-circle-check"></i> <span data-i18n-live>تم إرسال طلبك بنجاح إلى الإدارة في انتظار المراجعة والموافقة!</span>
        </div>

        <div id="errorAlert" class="alert-box alert-error">
            <i class="fa-solid fa-triangle-exclamation"></i> <span id="errorText">حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.</span>
        </div>

        <form id="broadcastForm">
            <div class="form-grid">
                <!-- مقدم الطلب -->
                <div class="input-group">
                    <label data-i18n-live>اسم مقدم الطلب <span class="required">*</span></label>
                    <input type="text" class="input-control" id="fullName" required placeholder="الاسم الكامل أو اسم المسؤول">
                </div>

                <div class="input-group">
                    <label data-i18n-live>البريد الإلكتروني <span class="required">*</span></label>
                    <input type="email" class="input-control" id="email" required placeholder="name@gmarik.com">
                </div>

                <div class="input-group">
                    <label data-i18n-live>رقم الهاتف / واتساب <span class="required">*</span></label>
                    <input type="tel" class="input-control" id="phone" required placeholder="010xxxxxxxx">
                </div>

                <div class="input-group">
                    <label data-i18n-live>تصنيف البث <span class="required">*</span></label>
                    <select class="input-control" id="category" required>
                        <option value="" disabled selected data-i18n-live>اختر التصنيف...</option>
                        <option value="customs_update" data-i18n-live>تحديثات جمركية وقوانين</option>
                        <option value="consultation" data-i18n-live>استشارات استيراد وتصدير</option>
                        <option value="training" data-i18n-live>ورشة عمل أو تدريب تخصصي</option>
                        <option value="general" data-i18n-live>محتوى عام مجازين</option>
                    </select>
                </div>

                <div class="input-group">
                    <label data-i18n-live>نوع مقدم البث <span class="required">*</span></label>
                    <select class="input-control" id="presenterType" required>
                        <option value="" disabled selected data-i18n-live>اختر نوع المقدم...</option>
                        <option value="بشري" data-i18n-live>بشري</option>
                        <option value="ذكاء اصطناعي" data-i18n-live>ذكاء اصطناعي</option>
                    </select>
                </div>

                <div class="input-group full">
                    <label data-i18n-live>صورة الثامبنيل (غلاف البث) <span class="required">*</span></label>
                    <input type="file" class="input-control" id="thumbnailFile" accept="image/*" required style="padding: 10px 16px;">
                    <div id="thumbnailPreviewWrap" style="display:none; margin-top: 10px;">
                        <img id="thumbnailPreviewImg" src="" alt="معاينة الصورة" style="max-width: 160px; max-height: 160px; border-radius: 10px; border: 1px solid var(--panel-border); object-fit: cover;">
                    </div>
                </div>

                <!-- تفاصيل البث -->
                <div class="input-group full">
                    <label data-i18n-live>عنوان البث المقترح <span class="required">*</span></label>
                    <input type="text" class="input-control" id="broadcastTitle" required placeholder="مثال: شرح التعديلات الجديدة للتعريفة الجمركية 2026">
                </div>

                <div class="input-group">
                    <label data-i18n-live>التاريخ المقترح للبث <span class="required">*</span></label>
                    <input type="date" class="input-control" id="broadcastDate" required>
                </div>

                <div class="input-group">
                    <label data-i18n-live>وقت البدء (الساعة) <span class="required">*</span></label>
                    <input type="time" class="input-control" id="broadcastTime" required>
                </div>

                <div class="input-group full">
                    <label data-i18n-live>وصف تفصيلي لمحتوى البث (يوجه للمدير) <span class="required">*</span></label>
                    <textarea class="input-control" id="broadcastDesc" required placeholder="اشرح باختصار النقاط والمواضيع التي سيتم طرحها خلال البث ليتم تقييمها..."></textarea>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i>
                <span data-i18n-live>إرسال الطلب للاعتماد</span>
            </button>
        </form>
    </div>
</div>

<!-- Firebase Integration & UI Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD_pyEgRtBzObOTf-msTwC0nbhsyCmJ92s",
        authDomain: "gamarek.firebaseapp.com",
        databaseURL: "https://gamarek-default-rtdb.firebaseio.com",
        projectId: "gamarek",
        storageBucket: "gamarek.firebasestorage.app",
        messagingSenderId: "139734553489",
        appId: "1:139734553489:web:1339f96b98cebd32610030",
        measurementId: "G-H1FRFXK1FG"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);
    
    window.firebaseApp = app;
    window.firebaseAnalytics = analytics;
    window.db = db;

    // معاينة فورية لصورة الثامبنيل المختارة
    const thumbnailFileInput = document.getElementById('thumbnailFile');
    const thumbnailPreviewWrap = document.getElementById('thumbnailPreviewWrap');
    const thumbnailPreviewImg = document.getElementById('thumbnailPreviewImg');

    thumbnailFileInput.addEventListener('change', function() {
        const file = thumbnailFileInput.files[0];
        if (file) {
            const objectUrl = URL.createObjectURL(file);
            thumbnailPreviewImg.src = objectUrl;
            thumbnailPreviewWrap.style.display = 'block';
        } else {
            thumbnailPreviewWrap.style.display = 'none';
            thumbnailPreviewImg.src = '';
        }
    });

    // تصغير وضغط الصورة محلياً في المتصفح ثم تحويلها لنص (Base64) بدون أي رفع خارجي
    // ده بيخلي الصورة تتخزن مباشرة جوه بيانات الطلب في Firestore - مجاني بالكامل وبدون Firebase Storage
    function compressImageToBase64(file, maxDimension = 700, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const reader = new FileReader();

            reader.onload = function(e) {
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxDimension) {
                        height = Math.round(height * (maxDimension / width));
                        width = maxDimension;
                    } else if (height > maxDimension) {
                        width = Math.round(width * (maxDimension / height));
                        height = maxDimension;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    resolve(dataUrl);
                };
                img.onerror = () => reject(new Error('تعذر قراءة الصورة، تأكد أن الملف صورة صالحة'));
                img.src = e.target.result;
            };
            reader.onerror = () => reject(new Error('تعذر قراءة ملف الصورة'));
            reader.readAsDataURL(file);
        });
    }

    // التعامل مع نموذج تقديم الطلب وحفظه في Firestore
    const form = document.getElementById('broadcastForm');
    const submitBtn = document.getElementById('submitBtn');
    const successAlert = document.getElementById('successAlert');
    const errorAlert = document.getElementById('errorAlert');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري تجهيز الصورة والإرسال...';
        successAlert.style.display = 'none';
        errorAlert.style.display = 'none';

        try {
            // ضغط صورة الثامبنيل وتحويلها لنص عشان تتخزن جوه الطلب مباشرة (بدون Storage)
            const thumbnailFile = thumbnailFileInput.files[0];
            let thumbnailUrl = '';

            if (thumbnailFile) {
                thumbnailUrl = await compressImageToBase64(thumbnailFile);
                console.log('حجم الصورة بعد الضغط (تقريبي):', Math.round(thumbnailUrl.length / 1024), 'كيلوبايت');

                // Firestore بيرفض المستند لو تعدى 1 ميجابايت، فبنتأكد إن الصورة أصغر من كده بأمان
                if (thumbnailUrl.length > 900000) {
                    throw new Error('حجم الصورة بعد الضغط لسه كبير، من فضلك اختاري صورة أصغر.');
                }
            }

            const payload = {
                applicantName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                category: document.getElementById('category').options[document.getElementById('category').selectedIndex].text,
                presenterType: document.getElementById('presenterType').value,
                streamTitle: document.getElementById('broadcastTitle').value.trim(),
                date: document.getElementById('broadcastDate').value,
                time: document.getElementById('broadcastTime').value,
                description: document.getElementById('broadcastDesc').value.trim(),
                thumbnailUrl: thumbnailUrl,
                status: 'pending', // pending = في انتظار مراجعة المدير | approved = مقبول | rejected = مرفوض
                createdAt: serverTimestamp()
            };

            // حفظ الطلب (وبداخله الصورة كنص) في مجموعة liveStreamRequests لتظهر عند المدير
            await addDoc(collection(db, "liveStreamRequests"), payload);

            successAlert.style.display = 'block';
            form.reset();
            thumbnailPreviewWrap.style.display = 'none';
            thumbnailPreviewImg.src = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => {
                successAlert.style.display = 'none';
            }, 6000);
        } catch (error) {
            console.error("خطأ في إرسال البيانات إلى فايربيز:", error);
            document.getElementById('errorText').textContent = "حدث خطأ أثناء إرسال الطلب: " + error.message;
            errorAlert.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span data-i18n-live>إرسال الطلب للاعتماد</span>';
        }
    });
</script>

<!-- نظام الترجمة التلقائية -->
<script>
(function () {
    const htmlRoot = document.getElementById('html-root');
    const liveTranslationCache = {};

    function toGoogleLangCode(lang) {
        const map = { zh: 'zh-CN' };
        return map[lang] || lang;
    }

    async function translateLiveText(text, targetLang) {
        if (!text) return text;
        const cacheKey = targetLang + '::' + text;
        if (liveTranslationCache[cacheKey]) return liveTranslationCache[cacheKey];

        try {
            const googleLang = toGoogleLangCode(targetLang);
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${googleLang}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Translation API error');
            const data = await res.json();
            const translated = data[0].map(part => part[0]).join('');
            liveTranslationCache[cacheKey] = translated;
            return translated;
        } catch (err) {
            console.error('Translation error:', err);
            return text;
        }
    }

    async function applyLanguage() {
        const lang = localStorage.getItem('gmarik_lang') || 'ar';
        const dir = lang === 'ar' ? 'rtl' : 'ltr';

        htmlRoot.setAttribute('lang', lang);
        htmlRoot.setAttribute('dir', dir);

        const nodes = document.querySelectorAll('[data-i18n-live]');
        for (const el of nodes) {
            if (!el.hasAttribute('data-original')) {
                el.setAttribute('data-original', el.textContent.trim());
            }
            const original = el.getAttribute('data-original');
            el.textContent = (lang === 'ar') ? original : await translateLiveText(original, lang);
        }
    }

    window.addEventListener('DOMContentLoaded', applyLanguage);
})();
</script>
</body>
</html>
