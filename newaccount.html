<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">انشاء حساب - جمارك مجازين</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Firebase الإصدار 9 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        @keyframes auroraMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @keyframes gradientGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes appleCheckCircle {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes appleCheckDraw {
            0% { stroke-dashoffset: 48; }
            100% { stroke-dashoffset: 0; }
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(-45deg, #050b14, #0a192f, #020c1b, #0f172a);
            background-size: 400% 400%;
            animation: auroraMove 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212,175,55,0.12) 0%, rgba(0,0,0,0) 70%);
            top: -50px; right: -50px; border-radius: 50%; z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(14,165,233,0.08) 0%, rgba(0,0,0,0) 70%);
            bottom: -50px; left: -50px; border-radius: 50%; z-index: 0;
            animation: float 10s ease-in-out infinite alternate-reverse;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(10, 25, 47, 0.55);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            animation: cardEntrance 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, float 6s ease-in-out infinite;
            box-sizing: border-box;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 900;
            font-size: 1.5rem;
            text-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            letter-spacing: -0.5px;
        }

        h2::after {
            content: '';
            display: block;
            width: 45px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 6px auto 0;
            border-radius: 5px;
        }

        .form-group {
            margin-bottom: 12px;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
            text-align: start;
        }

        .form-group:focus-within label {
            color: #d4af37;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            color: #e2e8f0;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            text-align: start;
        }

        select option {
            background: #0a192f;
            color: #e2e8f0;
        }

        input::placeholder { color: #475569; }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .row { display: flex; gap: 10px; }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            position: relative;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-submit {
            background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
            background-size: 200% auto;
            color: #050b14;
            margin-top: 4px;
            box-shadow: 0 8px 15px rgba(212, 175, 55, 0.2);
            animation: gradientGlow 3s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 45px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.35);
        }

        .success-checkmark {
            display: none;
            width: 28px;
            height: 28px;
            animation: appleCheckCircle 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .success-checkmark svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #050b14;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .success-checkmark path {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: appleCheckDraw 0.4s ease 0.2s forwards;
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .action-link-btn {
            background: rgba(255, 255, 255, 0.03);
            color: #cbd5e1;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 9px 6px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .action-link-btn:hover {
            border-color: rgba(212, 175, 55, 0.5);
            color: #ffd700;
            background: rgba(212, 175, 55, 0.05);
            transform: translateY(-1px);
        }

        .btn-have-account {
            grid-column: span 2;
            color: #ffd700;
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            font-weight: 700;
            background: rgba(212, 175, 55, 0.08);
        }

        .full-width-link { grid-column: span 2; }

        .success-box {
            display: none;
            text-align: center;
            padding: 15px 10px;
        }
        .success-box p {
            font-size: 1.05rem;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .btn-login-redirect {
            background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
            color: #050b14;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 800;
            display: block;
            box-shadow: 0 8px 15px rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 data-i18n-auto>انشاء حساب في جمارك مجازين</h2>
        
        <form id="signup-form">
            <div class="row">
                <div class="form-group" style="flex: 1;">
                    <label data-i18n-auto>الاسم الأول</label>
                    <input type="text" id="first-name" data-i18n-ph-auto="الاسم الأول" placeholder="الاسم الأول" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label data-i18n-auto>الاسم الثاني</label>
                    <input type="text" id="last-name" data-i18n-ph-auto="الاسم الثاني" placeholder="الاسم الثاني" required>

            </div>

            <div class="form-group">
                <label data-i18n-auto>البريد الإلكتروني</label>

                <input type="password" id="password" placeholder="••••••••" required>

            <div class="form-group">

            <div class="form-group">
                <label data-i18n-auto>حدد طبيعة الحساب (الصلاحية)</label>

                    <option value="" disabled selected data-i18n-auto>اختر الصلاحية</option>
                    <option value="index.html" data-i18n-auto>متفرج (تصفح الأخبار والمتابعة)</option>
                    <option value="reporter-register.html" data-i18n-auto>المراسل</option>
                    <option value="company-regester.html" data-i18n-auto>الشركات (تسجيل في الدليل)</option>
                    <option value="translator.html" data-i18n-auto>المترجم</option>
                    <option value="editorial-secretary.html" data-i18n-auto>المحرر</option>
                    <option value="head-of-department.html" data-i18n-auto>رئيس القسم</option>
                    <option value="managing-editor.html" data-i18n-auto>رئيس التحرير</option>
                    <option value="proofreader.html" data-i18n-auto>المراجع اللغوي</option>

            </div>

            <button type="submit" id="submit-btn" class="btn-submit">
                <span id="btn-text" data-i18n-auto>إنشاء الحساب</span>

                    <svg viewBox="0 0 52 52">
                        <path d="M14 27l9 9 16-16"/>
                    </svg>
                </div>
            </button>
            
            <div class="links-grid">
                <a href="reporter-login.html" class="action-link-btn btn-have-account" data-i18n-auto>أنا أمتلك حساباً بالفعل</a>
                <a href="forgottenpass.html" class="action-link-btn full-width-link" data-i18n-auto>نسيت كلمة المرور؟</a>
                <a href="reporter-status.html" class="action-link-btn" data-i18n-auto>تتبع طلب مراسل</a>

        <div id="success-box" class="success-box">

        </div>
    </div>

<!-- ==================== محرك الترجمة الآلي (GTX API) ==================== -->
<script>
    const translationCache = {};

    function toGoogleLangCode(lang) {
        const map = { zh: 'zh-CN', el: 'el', ko: 'ko', ja: 'ja', ru: 'ru', tr: 'tr', de: 'de', fr: 'fr', es: 'es', it: 'it', ar: 'ar', en: 'en' };
        return map[lang] || lang;
    }

    async function translateText(text, targetLang) {
        if (!text) return '';
        text = text.trim();
        if (!text || targetLang === 'ar') return text;

        const cacheKey = targetLang + '::' + text;
        if (translationCache[cacheKey]) return translationCache[cacheKey];

        try {
            const googleLang = toGoogleLangCode(targetLang);
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${googleLang}&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Translation API error');
            const data = await res.json();
            const translated = data[0].map(part => part[0]).join('');
            translationCache[cacheKey] = translated;
            return translated;
        } catch (err) {
            return text;
        }
    }

    async function applyDynamicTranslation() {
        const currentLang = localStorage.getItem('gmarik_lang') || 'ar';
        const htmlRoot = document.getElementById('html-root');
        const isRtl = (currentLang === 'ar');

        htmlRoot.setAttribute('lang', currentLang);
        htmlRoot.setAttribute('dir', isRtl ? 'rtl' : 'ltr');

        // ترجمة كافة النصوص التي تحمل data-i18n-auto
        const autoElements = document.querySelectorAll('[data-i18n-auto]');
        for (let el of autoElements) {
            if (!el.hasAttribute('data-original-text')) {
                el.setAttribute('data-original-text', el.innerText.trim());
            }
            const original = el.getAttribute('data-original-text');
            if (currentLang === 'ar') {
                el.innerText = original;
            } else {
                translateText(original, currentLang).then(translated => {
                    if (translated) el.innerText = translated;
                });
            }
        }

        // ترجمة الـ Placeholders
        const phElements = document.querySelectorAll('[data-i18n-ph-auto]');
        for (let el of phElements) {
            const originalPh = el.getAttribute('data-i18n-ph-auto');
            if (currentLang === 'ar') {
                el.setAttribute('placeholder', originalPh);
            } else {
                translateText(originalPh, currentLang).then(translated => {
                    if (translated) el.setAttribute('placeholder', translated);
                });
            }
        }

        // ترجمة عنوان التبويب
        const metaTitle = document.getElementById('meta-title');
        if (metaTitle) {
            if (currentLang === 'ar') {
                metaTitle.innerText = "انشاء حساب - جمارك مجازين";
            } else {
                translateText("انشاء حساب - جمارك مجازين", currentLang).then(t => {
                    if (t) metaTitle.innerText = t;
                });
            }
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        applyDynamicTranslation();
    });

    window.addEventListener('storage', (e) => {
        if (e.key === 'gmarik_lang') {
            applyDynamicTranslation();
        }
    });
</script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD_pyEgRtBzObOTf-msTwC0nbhsyCmJ92s",
        authDomain: "gamarek.firebaseapp.com",
        projectId: "gamarek",
        storageBucket: "gamarek.firebasestorage.app",
        messagingSenderId: "139734553489",
        appId: "1:139734553489:web:7ae77102fc204b08610030"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    document.getElementById('signup-form').onsubmit = function(e) {
        e.preventDefault();
        const firstName = document.getElementById('first-name').value.trim();
        const lastName = document.getElementById('last-name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const birthdate = document.getElementById('birthdate').value;
        const selectedRole = document.getElementById('roleSelect').value;

        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const checkmark = document.getElementById('success-checkmark');

        submitBtn.disabled = true;

        firebase.auth().createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                
                return db.collection("users").doc(user.uid).set({
                    firstName,
                    lastName,
                    email,
                    birthdate,
                    rolePage: selectedRole,
                    createdAt: new Date()
                });
            })
            .then(() => {
                // تخزين اسم الشخص لتظهر فوق خالص في الـ index أو أي صفحة
                const fullName = firstName + " " + lastName;
                localStorage.setItem('gmarik_logged_user', fullName);
                localStorage.setItem('gmarik_user', fullName);

                // إظهار علامة الصح الـ Apple Pay
                btnText.style.display = 'none';
                checkmark.style.display = 'block';

                // ضبط زر الانتقال للصفحة بناءً على الصلاحية المختارة
                const redirectLink = document.getElementById('redirect-link');
                redirectLink.href = selectedRole;

                setTimeout(() => {
                    document.getElementById('signup-form').style.display = 'none';
                    document.getElementById('success-box').style.display = 'block';
                }, 1000);
            })
            .catch(async (error) => {
                const currentLang = localStorage.getItem('gmarik_lang') || 'ar';
                const translatedErr = await translateText('خطأ في إنشاء الحساب: ' + error.message, currentLang);
                alert(translatedErr);
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                checkmark.style.display = 'none';
            });
    };
</script>
