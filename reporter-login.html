<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">تسجيل الدخول - Gmarik Magazine</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        :root {
            --bg-deep: #030014;
            --card-bg: rgba(13, 10, 35, 0.65);
            --primary-glow: #6366f1;
            --accent-gold: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glass: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090514 50%, var(--bg-deep) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية النجوم الفضائية المتحركة */
        .space-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #6366f1, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #f59e0b, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 180px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 250px, #3b82f6, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 380px 80px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 400px 400px;
            animation: spaceDrift 100s linear infinite;
            z-index: -2;
            opacity: 0.5;
        }

        @keyframes spaceDrift {
            from { transform: translateY(0); }
            to { transform: translateY(-400px); }
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(245, 158, 11, 0.15));
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            animation: floatGlow 10s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translateY(-40px) scale(0.9); }
            100% { transform: translateY(40px) scale(1.2); }
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass);
            padding: 45px 35px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.15);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border-top: 4px solid var(--accent-gold);
            animation: fadeInCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(25px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area h2 {
            margin: 0;
            font-size: 1.9rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 20%, #818cf8 60%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 600;
            text-align: start;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(5, 3, 15, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            text-align: start;
        }

        .input-group input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25), 0 0 15px rgba(99, 102, 241, 0.4);
            background: rgba(5, 3, 15, 0.95);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-glow), #4f46e5);
            color: #fff;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            cursor: pointer;
            font-size: 1.05rem;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.6);
            opacity: 0.95;
        }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }

        .footer-links a:hover {
            text-decoration: underline;
            text-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
        }

        /* رسائل الخطأ والنجاح العصرية داخل الكارد */
        .msg-box {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }

        .success-msg {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: #6ee7b7;
            font-weight: 700;
            font-size: 1.05rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <!-- مكتبات فايربيس -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="space-stars"></div>
    <div class="bg-glow"></div>

    <div class="login-card">
        <div class="logo-area">
            <h2>Gmarik Magazine</h2>
            <p data-i18n-auto>بوابة تسجيل الدخول الموحدة</p>
        </div>

        <div id="errorAlert" class="msg-box error-msg"></div>
        <div id="successAlert" class="msg-box success-msg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label data-i18n-auto>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" data-i18n-ph-auto="name@example.com" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label data-i18n-auto>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">
                <span id="submitBtnText" data-i18n-auto>تسجيل الدخول 🚀</span>
            </button>
        </form>

        <div class="footer-links" id="footerLinksContainer">
            <span data-i18n-auto>نسيت الباسورد أو تود متابعة طلبك؟</span> <a href="reporter-status.html" data-i18n-auto>اضغط هنا</a>
        </div>
    </div>

    <!-- ==================== محرك الترجمة الآلي (GTX API) ==================== -->
    <script>
        const translationCache = {};

        function toGoogleLangCode(lang) {
            const map = { zh: 'zh-CN', el: 'el', ko: 'ko', ja: 'ja', ru: 'ru', tr: 'tr', de: 'de', fr: 'fr', es: 'es', it: 'it', ar: 'ar', en: 'en' };
            return map[lang] || lang;
        }

        async function translateText(text, targetLang) {
            if (!text) return '';
            text = text.trim();
            if (!text || targetLang === 'ar') return text;

            const cacheKey = targetLang + '::' + text;
            if (translationCache[cacheKey]) return translationCache[cacheKey];

            try {
                const googleLang = toGoogleLangCode(targetLang);
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${googleLang}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('Translation API error');
                const data = await res.json();
                const translated = data[0].map(part => part[0]).join('');
                translationCache[cacheKey] = translated;
                return translated;
            } catch (err) {
                return text;
            }
        }

        async function applyDynamicTranslation() {
            const currentLang = localStorage.getItem('gmarik_lang') || 'ar';
            const htmlRoot = document.getElementById('html-root');
            const isRtl = (currentLang === 'ar');

            htmlRoot.setAttribute('lang', currentLang);
            htmlRoot.setAttribute('dir', isRtl ? 'rtl' : 'ltr');

            const autoElements = document.querySelectorAll('[data-i18n-auto]');
            for (let el of autoElements) {
                if (!el.hasAttribute('data-original-text')) {
                    el.setAttribute('data-original-text', el.innerText.trim());
                }
                const original = el.getAttribute('data-original-text');
                if (currentLang === 'ar') {
                    el.innerText = original;
                } else {
                    translateText(original, currentLang).then(translated => {
                        if (translated) el.innerText = translated;
                    });
                }
            }

            const phElements = document.querySelectorAll('[data-i18n-ph-auto]');
            for (let el of phElements) {
                const originalPh = el.getAttribute('data-i18n-ph-auto');
                if (currentLang === 'ar') {
                    el.setAttribute('placeholder', originalPh);
                } else {
                    translateText(originalPh, currentLang).then(translated => {
                        if (translated) el.setAttribute('placeholder', translated);
                    });
                }
            }

            const metaTitle = document.getElementById('meta-title');
            if (metaTitle) {
                if (currentLang === 'ar') {
                    metaTitle.innerText = "تسجيل الدخول - Gmarik Magazine";
                } else {
                    translateText("تسجيل الدخول - Gmarik Magazine", currentLang).then(t => {
                        if (t) metaTitle.innerText = t;
                    });
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyDynamicTranslation();
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'gmarik_lang') {
                applyDynamicTranslation();
            }
        });
    </script>

    <!-- برمجة تسجيل الدخول و Firebase مع دعم سكرتير التحرير -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD_pyEgRtBzObOTf-msTwC0nbhsyCmJ92s",
            authDomain: "gamarek.firebaseapp.com",
            projectId: "gamarek",
            storageBucket: "gamarek.firebasestorage.app",
            messagingSenderId: "139734553489",
            appId: "1:139734553489:web:1339f96b98cebd32610030"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            const submitBtn = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');
            const currentLang = localStorage.getItem('gmarik_lang') || 'ar';

            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
            
            const verifyingText = await translateText("جاري التحقق...", currentLang);
            submitBtnText.innerText = verifyingText;
            submitBtn.disabled = true;

            try {
                // ================================================================
                // 1) 🌟 فحص حسابات سكرتارية التحرير (editorialSecretaryApplications) 🌟
                // ================================================================
                const secSnapshot = await db.collection('editorialSecretaryApplications')
                    .where('email', '==', email)
                    .get();

                if (!secSnapshot.empty) {
                    const secDocSnap = secSnapshot.docs[0];
                    const secDoc = secDocSnap.data();

                    if (secDoc.status !== 'approved' || !secDoc.accountActivated) {
                        throw new Error('تم استلام طلبك لوظيفة سكرتير تحرير وهو قيد المراجعة أو بانتظار تفعيل كلمة المرور عبر صفحة الاستعلام.');
                    }

                    if (secDoc.password !== password) {
                        throw new Error('كلمة المرور غير صحيحة، يرجى التأكد والمحاولة مرة أخرى.');
                    }

                    localStorage.setItem('gmarik_logged_secretary', JSON.stringify({
                        id: secDocSnap.id,
                        fullName: secDoc.fullName,
                        email: secDoc.email,
                        role: 'سكرتير تحرير',
                        trackingCode: secDoc.trackingCode || ''
                    }));
                    localStorage.setItem('gmarik_logged_user', secDoc.fullName);
                    localStorage.setItem('gmarik_user', secDoc.fullName);

                    const welcomeSec = await translateText(`مرحباً بك يا ${secDoc.fullName} (سكرتير التحرير)!`, currentLang);
                    successAlert.innerHTML = `✨ ${welcomeSec} 🎉`;
                    successAlert.style.display = 'block';

                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('footerLinksContainer').style.display = 'none';

                    // 🚀 التوجيه لصفحة سكرتير التحرير المحددة
                    setTimeout(() => {
                        window.location.href = "editorial-secretary.html";
                    }, 1800);
                    return;
                }

                // ================================================================
                // 2) فحص حساب عادي (Firebase Auth + users)
                // ================================================================
                let authUser = null;
                try {
                    const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                    authUser = userCredential.user;
                } catch (authError) {
                    authUser = null;
                }

                if (authUser) {
                    const userDocSnap = await db.collection("users").doc(authUser.uid).get();
                    const userData = userDocSnap.exists ? userDocSnap.data() : {};
                    const fullName = [userData.firstName, userData.lastName].filter(Boolean).join(" ") || email;

                    localStorage.setItem('gmarik_logged_user', fullName);
                    localStorage.setItem('gmarik_user', fullName);

                    const welcomeText = await translateText(`مرحباً بك يا ${fullName}!`, currentLang);
                    successAlert.innerHTML = `✨ ${welcomeText} 🎉`;
                    successAlert.style.display = 'block';
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('footerLinksContainer').style.display = 'none';

                    const destination = userData.rolePage || 'index.html';
                    setTimeout(() => {
                        window.location.href = destination;
                    }, 1800);
                    return;
                }

                // ================================================================
                // 3) فحص حساب الشركات (users collection)
                // ================================================================
                const companySnapshot = await db.collection('users')
                    .where('email', '==', email)
                    .get();

                if (!companySnapshot.empty) {
                    const companyDocSnap = companySnapshot.docs[0];
                    const companyData = companyDocSnap.data();

                    if (companyData.password === password) {
                        const companyName = companyData.companyName || email;

                        localStorage.setItem('gmarik_logged_company', JSON.stringify({
                            id: companyDocSnap.id,
                            companyName: companyName,
                            email: companyData.email,
                            plan: companyData.plan || '',
                            trackingCode: companyData.trackingCode || ''
                        }));
                        localStorage.setItem('gmarik_logged_user', companyName);
                        localStorage.setItem('gmarik_user', companyName);

                        const welcomeCompany = await translateText(`مرحباً بك يا ${companyName}!`, currentLang);
                        successAlert.innerHTML = `✨ ${welcomeCompany} 🎉`;
                        successAlert.style.display = 'block';

                        document.getElementById('loginForm').style.display = 'none';
                        document.getElementById('footerLinksContainer').style.display = 'none';

                        setTimeout(() => {
                            window.location.href = "company-dashboard.html";
                        }, 1800);
                        return;
                    }
                }

                // ================================================================
                // 4) فحص حساب المراسلين المعتمدين (reporterApplications)
                // ================================================================
                let repSnapshot = await db.collection('reporterApplications')
                    .where('loginEmail', '==', email)
                    .get();

                if (repSnapshot.empty) {
                    repSnapshot = await db.collection('reporterApplications')
                        .where('email', '==', email)
                        .get();
                }

                if (!repSnapshot.empty) {
                    const reporterDocSnap = repSnapshot.docs[0];
                    const reporterDoc = reporterDocSnap.data();

                    if (reporterDoc.status !== 'approved' || !reporterDoc.accountActivated) {
                        throw new Error('هذا الحساب لم يتم اعتماده بعد من رئيس التحرير أو غير مفعّل.');
                    }

                    if (reporterDoc.password !== password) {
                        throw new Error('كلمة المرور غير صحيحة، حاول مرة أخرى.');
                    }

                    localStorage.setItem('gmarik_logged_reporter', JSON.stringify({
                        id: reporterDocSnap.id,
                        fullName: reporterDoc.fullName,
                        email: reporterDoc.loginEmail || reporterDoc.email,
                        country: reporterDoc.country,
                        city: reporterDoc.city,
                        username: reporterDoc.username || '',
                        avatar: reporterDoc.avatar || '',
                        bio: reporterDoc.bio || ''
                    }));
                    localStorage.setItem('gmarik_logged_user', reporterDoc.fullName);
                    localStorage.setItem('gmarik_user', reporterDoc.fullName);

                    const welcomeReporter = await translateText(`مرحباً بك يا ${reporterDoc.fullName}!`, currentLang);
                    successAlert.innerHTML = `✨ ${welcomeReporter} 🎉`;
                    successAlert.style.display = 'block';
                    
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('footerLinksContainer').style.display = 'none';

                    setTimeout(() => {
                        window.location.href = "reporterdashboard.html";
                    }, 1800);
                    return;
                }

                // إذا لم يتطابق البريد مع أي مستخدم
                throw new Error('البريد الإلكتروني أو كلمة المرور غير صحيحة.');

            } catch (error) {
                const translatedErr = await translateText(error.message, currentLang);
                errorAlert.innerText = translatedErr;
                errorAlert.style.display = 'block';
                const defaultBtnText = await translateText("تسجيل الدخول 🚀", currentLang);
                submitBtnText.innerText = defaultBtnText;
                submitBtn.disabled = false;
            }
        }

        async function resetPasswordRedirect(e) {
            e.preventDefault();
            const emailInput = document.getElementById('loginEmail').value.trim();
            window.location.href = `reporter-status.html${emailInput ? '?email=' + encodeURIComponent(emailInput) : ''}`;
        }
    </script>
</body>
</html>
