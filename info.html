        // دالة تحديث المحتوى مع أنيميشن سلس
        function loadLanguage() {
            // جلب اللغة المخزنة من الـ index (نفس المفتاح gmarik_lang المستخدم في index.html)
            const selectedLang = localStorage.getItem('gmarik_lang') || 'ar';
            const data = translations[selectedLang] || translations['ar'];

            // ضبط اتجاه الصفحة واللغة
            const htmlTag = document.getElementById('htmlTag');
            htmlTag.setAttribute('lang', data.lang);
            htmlTag.setAttribute('dir', data.dir);

            // تحديد العناصر وتطبيق الأنيميشن
            const titleEl = document.getElementById('pageTitle');
            const headingEl = document.getElementById('sectionTitle');
            const contentEl = document.getElementById('sectionContent');
            const footerEl = document.getElementById('footerText');
            const backEl = document.getElementById('backBtn');

            // تأثير اختفاء سريع لتغيير النص بانسيابية
            contentEl.style.opacity = '0';
            headingEl.style.opacity = '0';

            setTimeout(() => {
                titleEl.innerText = data.title;
                headingEl.innerText = data.heading;
                contentEl.innerText = data.content;
                footerEl.innerText = data.footer;
                backEl.innerText = data.back;

                // إعادة ظهور النص بحركة ناعمة
                contentEl.style.opacity = '1';
                headingEl.style.opacity = '1';
            }, 200);
        }

        // تشغيل الدالة عند فتح الصفحة
        window.onload = loadLanguage;
    </script>
