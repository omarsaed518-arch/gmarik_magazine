<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الخبر | Gmarik Magazine</title>
     <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.png">
    <script src="favicon.js"></script>
    <style>
        body { font-family: 'Cairo', Tahoma, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; }
        header { background: #0a2540; color: #fff; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-size: 1.5rem; font-weight: bold; color: #fff; cursor: pointer; }
        .logo-text span { color: #d4af37; }
        .container { max-width: 850px; margin: 40px auto; background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .post-header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }
        .publisher-info { display: flex; align-items: center; gap: 12px; }
        .publisher-avatar { width: 45px; height: 45px; border-radius: 50%; background: #0a2540; color: #d4af37; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .publisher-name { font-weight: bold; color: #0a2540; cursor: pointer; }
        .publisher-name:hover { color: #d4af37; text-decoration: underline; }
        h1 { color: #0a2540; font-size: 1.8rem; margin-bottom: 15px; }
        .post-img { width: 100%; height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 25px; }
        .post-body { color: #475569; line-height: 1.8; font-size: 1.1rem; }
        .back-btn { display: inline-block; margin-top: 30px; background: #0a2540; color: #d4af37; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo-text" onclick="location.href='index.html'">GMARIK <span>MAGAZINE</span></div>
    </header>

    <div class="container" id="post-container">
        <h2 style="text-align:center; color:#64748b;">جاري تحميل تفاصيل الخبر...</h2>
    </div>

    <script>
        const postsData = {
            1: {
                publisher: "منظمة الجمارك العالمية",
                channelId: "wco",
                avatar: "WCO",
                time: "منذ ساعتين",
                title: "تطبيق نظام الفحص بالأشعة الذكي للContainers في الموانئ الرئيسية",
                img: "https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=800&q=80",
                text: "أعلنت الإدارة العامة للجمارك عن بدء تشغيل أحدث المنظومات المعتمدة على الذكاء الاصطناعي لتقليل وقت التخليص الجمركي بنسبة 40%، وتفتيش الحاويات بدقة وسرعة فائقة دون تأخير حركة التجارة بالموانئ الرئيسية."
            },
            2: {
                publisher: "مصلحة الجمارك المصرية",
                channelId: "egypt_customs",
                avatar: "م ج",
                time: "منذ 4 ساعات",
                title: "تحديث قائمة السلع المعفاة من الرسوم الجمركية لعام 2026",
                img: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=800&q=80",
                text: "نشرت الجريدة الرسمية القرار الجديد بشأن تعديل قائمة السلع الأساسية والمعدات الصناعية المعفاة لدعم التصنيع المحلي وتخفيف الأعباء عن المستوردين والقطاع الإنتاجي."
            },
            3: {
                publisher: "منظمة الجمارك العالمية",
                channelId: "wco",
                avatar: "WCO",
                time: "منذ يوم",
                title: "توقيع بروتوكول تعاون لتسهيل التجارة العابرة للحدود",
                img: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=800&q=80",
                text: "وقعت المنظمة اتفاقية جديدة لربط الأنظمة الجمركية إلكترونياً بين الدول الأعضاء لتسريع وتيرة الشحن البري وتسهيل حركة نفاذ البضائع."
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const post = postsData[postId];

        const container = document.getElementById('post-container');

        if (post) {
            container.innerHTML = `
                <div class="post-header-info">
                    <div class="publisher-info">
                        <div class="publisher-avatar">${post.avatar}</div>
                        <div>
                            <span class="publisher-name" onclick="location.href='channel.html?id=${post.channelId}'">${post.publisher}</span><br>
                            <small style="color:#94a3b8;">${post.time}</small>
                        </div>
                    </div>
                </div>
                <h1>${post.title}</h1>
                <img src="${post.img}" class="post-img">
                <div class="post-body">${post.text}</div>
                <br>
                <a href="index.html" class="back-btn">← العودة للرئيسية</a>
            `;
            
            // تحديث حالة الزرار فور تحميل الخبر
            updateFollowButtonUI(post.channelId);
        } else {
            container.innerHTML = `
                <h2 style="color:#d9534f; text-align:center;">عذراً، هذا الخبر غير موجود أو تم حذفه.</h2>
                <div style="text-align:center;"><a href="index.html" class="back-btn">العودة للرئيسية</a></div>
            `;
        }

        function getChannelKey(channelId) {
            return 'followed_channel_' + channelId;
        }

        function updateFollowButtonUI(channelId) {
            const btn = document.getElementById('follow-btn');
            if (!btn) return;
            
            const isFollowed = localStorage.getItem(getChannelKey(channelId)) === 'true';
            
            if (isFollowed) {
                btn.innerText = 'تمت المتابعة ✓';
                btn.style.background = '#0a2540';
                btn.style.color = '#fff';
            } else {
                btn.innerText = '+ متابعة';
                btn.style.background = 'transparent';
                btn.style.color = '#0a2540';
            }
        }

        function toggleFollow(channelId) {
            const key = getChannelKey(channelId);
            const isFollowed = localStorage.getItem(key) === 'true';
            
            if (isFollowed) {
                localStorage.setItem(key, 'false');
                alert('تم إلغاء المتابعة بنجاح');
            } else {
                localStorage.setItem(key, 'true');
                alert('تمت المتابعة بنجاح!');
            }
            
            updateFollowButtonUI(channelId);
        }
    </script>
</body>
</html>
